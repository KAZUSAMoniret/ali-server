# Replace blog.example.com everywhere before installation.
# This file is included in nginx's http context by sites-enabled.
limit_req_zone $binary_remote_addr zone=blog_login:10m rate=5r/m;

server {
    listen 80;
    server_name blog.example.com;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://blog.example.com$request_uri; }
}
server {
    listen 443 ssl;
    server_name blog.example.com;
    ssl_certificate /etc/letsencrypt/live/blog.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blog.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 12m;
    access_log /var/log/nginx/life-blog.access.log;
    error_log /var/log/nginx/life-blog.error.log;

    location /static/ {
        alias /srv/life-blog/static/;
        expires 1h;
        add_header X-Content-Type-Options nosniff;
    }
    location /_protected_media/ {
        internal;
        alias /var/lib/life-blog/media/;
        add_header Cache-Control "private, no-store, max-age=0" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location /media/ { return 404; }
    location = /admin/login/ {
        limit_req zone=blog_login burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/life-blog-proxy.conf;
    }
    location / { include /etc/nginx/snippets/life-blog-proxy.conf; }
}
