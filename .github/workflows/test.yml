name: Blog tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: blog
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: blog
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U blog"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test
      - run: python manage.py migrate --noinput && python manage.py test
        env:
          DATABASE_URL: postgresql://blog:ci-only-password@127.0.0.1:5432/blog
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: python scripts/postgres_smoke.py
        env:
          DATABASE_URL: postgresql://blog:ci-only-password@127.0.0.1:5432/blog
